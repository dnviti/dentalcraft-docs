<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Driving DentalCraft from a script or an agent"><title>Driving DentalCraft from a script or an agent</title><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9z" fill="#1F4E99"/></marker></defs><rect width="900" height="420" fill="#FFFFFF"/><rect x="20" y="140" width="170" height="70" rx="10" fill="#F2F3F4" stroke="#5E6B73" stroke-width="1.6"/><text x="105.0" y="170.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.95" font-weight="700" text-anchor="middle" fill="#1B2530">Agent or script</text><text x="105.0" y="189.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.95" font-weight="400" text-anchor="middle" fill="#1B2530">MCP client, shell</text><rect x="250" y="140" width="200" height="70" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="350.0" y="161.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.95" font-weight="700" text-anchor="middle" fill="#0B2A5B">dentalcraft-cli</text><text x="350.0" y="180.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.95" font-weight="400" text-anchor="middle" fill="#0B2A5B">run, describe, mcp,</text><text x="350.0" y="199.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.95" font-weight="400" text-anchor="middle" fill="#0B2A5B">render</text><line x1="190" y1="175" x2="248" y2="175" stroke="#1F4E99" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="220" y="160" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.649999999999999" font-weight="400" text-anchor="middle" fill="#1B2530"></text><rect x="500" y="24" width="380" height="130" rx="14" fill="none" stroke="#1E7B4F" stroke-width="1.4" stroke-dasharray="3 5"/><text x="514" y="44" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.9" font-weight="700" fill="#1E7B4F">Mode A: headless</text><rect x="530" y="60" width="320" height="70" rx="10" fill="#E6F4EC" stroke="#1E7B4F" stroke-width="1.6"/><text x="690.0" y="90.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.95" font-weight="700" text-anchor="middle" fill="#0C3A25">Headless session</text><text x="690.0" y="109.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.95" font-weight="400" text-anchor="middle" fill="#0C3A25">(dc-session)</text><rect x="500" y="200" width="380" height="130" rx="14" fill="none" stroke="#B36B00" stroke-width="1.4" stroke-dasharray="3 5"/><text x="514" y="220" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.9" font-weight="700" fill="#B36B00">Mode B: bridge to the running app</text><rect x="530" y="236" width="320" height="70" rx="10" fill="#FFF3DC" stroke="#B36B00" stroke-width="1.6"/><text x="690.0" y="266.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.95" font-weight="700" text-anchor="middle" fill="#4A2C00">dentalcraft --control PORT</text><text x="690.0" y="285.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.95" font-weight="400" text-anchor="middle" fill="#4A2C00">the app, bridge on 127.0.0.1</text><path d="M 450 160 L 480 160 L 480 95 L 528 95" fill="none" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 450 190 L 480 190 L 480 271 L 528 271" fill="none" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><text x="472" y="140" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.649999999999999" font-weight="400" text-anchor="middle" fill="#1B2530"></text><rect x="20" y="352" width="860" height="56" rx="10" fill="#FFFFFF" stroke="#5E6B73" stroke-width="1.6"/><text x="450.0" y="369.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.799999999999999" font-weight="700" text-anchor="middle" fill="#1B2530">One command registry</text><text x="450.0" y="383.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">project.*, case.*, scan.*, print.*, aligners.*, app.*</text><text x="450.0" y="398.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">same ids, same parameters, same results</text><text x="350" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">stdio, JSON-RPC (MCP)</text><text x="350" y="232" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">mcp --connect PORT</text><text x="450" y="316" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.649999999999999" font-weight="400" text-anchor="middle" fill="#1B2530"></text></svg>
