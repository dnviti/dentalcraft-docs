<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Il contenitore di progetto .dcprj"><title>Il contenitore di progetto .dcprj</title><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9z" fill="#1F4E99"/></marker></defs><rect width="900" height="400" fill="#FFFFFF"/><rect x="20" y="14" width="860" height="330" rx="14" fill="none" stroke="#1F4E99" stroke-width="1.4" stroke-dasharray="3 5"/><text x="34" y="34" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.9" font-weight="700" fill="#1F4E99">progetto.dcprj  (ZIP)</text><rect x="40" y="40" width="270" height="34" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="175.0" y="62.2" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13.95" font-weight="400" text-anchor="middle" fill="#0B2A5B">mimetype</text><rect x="330" y="40" width="530" height="34" rx="10" fill="#FFFFFF" stroke="#5E6B73" stroke-width="1.6"/><text x="595.0" y="61.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">prima voce, non compressa: application/vnd.dentalcraft.project+zip</text><rect x="40" y="82" width="270" height="34" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="175.0" y="104.2" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13.95" font-weight="400" text-anchor="middle" fill="#0B2A5B">manifest.json</text><rect x="330" y="82" width="530" height="34" rx="10" fill="#FFFFFF" stroke="#5E6B73" stroke-width="1.6"/><text x="595.0" y="103.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">format_version, moduli, BLAKE3 e dimensione di ogni voce</text><rect x="40" y="124" width="270" height="34" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="175.0" y="146.2" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13.95" font-weight="400" text-anchor="middle" fill="#0B2A5B">case.json</text><rect x="330" y="124" width="530" height="34" rx="10" fill="#FFFFFF" stroke="#5E6B73" stroke-width="1.6"/><text x="595.0" y="145.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">codice paziente pseudonimizzato, scansioni, sistema di riferimento</text><rect x="40" y="166" width="270" height="34" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="175.0" y="188.2" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13.95" font-weight="400" text-anchor="middle" fill="#0B2A5B">modules/&lt;id&gt;/state.json</text><rect x="330" y="166" width="530" height="34" rx="10" fill="#FFFFFF" stroke="#5E6B73" stroke-width="1.6"/><text x="595.0" y="187.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">dati del modulo, per esempio aligners</text><rect x="40" y="208" width="270" height="34" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="175.0" y="230.2" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13.95" font-weight="400" text-anchor="middle" fill="#0B2A5B">history/steps.json</text><rect x="330" y="208" width="530" height="34" rx="10" fill="#FFFFFF" stroke="#5E6B73" stroke-width="1.6"/><text x="595.0" y="229.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">cronologia dei passi (lo stack annulla non si salva)</text><rect x="40" y="250" width="270" height="34" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="175.0" y="272.2" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13.95" font-weight="400" text-anchor="middle" fill="#0B2A5B">blobs/&lt;blake3&gt;.dcm</text><rect x="330" y="250" width="530" height="34" rx="10" fill="#FFFFFF" stroke="#5E6B73" stroke-width="1.6"/><text x="595.0" y="271.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">mesh DCM1, indirizzate dal contenuto</text><rect x="40" y="292" width="270" height="34" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="175.0" y="314.2" font-family="'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13.95" font-weight="400" text-anchor="middle" fill="#0B2A5B">thumbnail.png</text><rect x="330" y="292" width="530" height="34" rx="10" fill="#FFFFFF" stroke="#5E6B73" stroke-width="1.6"/><text x="595.0" y="313.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">anteprima per la schermata Home</text><text x="450" y="372" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.649999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">Salvataggio: scrive .tmp, fsync, rinomina; si tiene un .bak. Apertura: BLAKE3 verificato, un formato più recente si apre in sola lettura.</text></svg>
