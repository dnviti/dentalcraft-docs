<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="From a change to a release"><title>From a change to a release</title><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9z" fill="#1F4E99"/></marker></defs><rect width="900" height="300" fill="#FFFFFF"/><rect x="20" y="30" width="130" height="96" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="85.0" y="56.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">Branch</text><text x="85.0" y="73.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">feat/* or fix/*</text><text x="85.0" y="91.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">conventional</text><text x="85.0" y="109.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">commits</text><rect x="166" y="30" width="130" height="96" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="231.0" y="48.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">Local gate</text><text x="231.0" y="65.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">fmt, clippy -D</text><text x="231.0" y="82.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">warnings,</text><text x="231.0" y="99.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">tests (+ Kani</text><text x="231.0" y="116.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">laws)</text><line x1="150" y1="78" x2="166" y2="78" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="312" y="30" width="130" height="96" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="377.0" y="57.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">Pull request</text><text x="377.0" y="74.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">ci-local.sh --pr</text><text x="377.0" y="90.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">on the merge</text><text x="377.0" y="107.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">result</text><line x1="296" y1="78" x2="312" y2="78" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="458" y="30" width="130" height="96" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="523.0" y="56.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">Squash merge</text><text x="523.0" y="73.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">title =</text><text x="523.0" y="91.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">conventional</text><text x="523.0" y="109.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">commit</text><line x1="442" y1="78" x2="458" y2="78" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="604" y="30" width="130" height="96" rx="10" fill="#FFF3DC" stroke="#B36B00" stroke-width="1.6"/><text x="669.0" y="56.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#4A2C00">Release PR</text><text x="669.0" y="73.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#4A2C00">release-please</text><text x="669.0" y="91.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#4A2C00">bumps,</text><text x="669.0" y="109.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#4A2C00">changelog</text><line x1="588" y1="78" x2="604" y2="78" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="750" y="30" width="130" height="96" rx="10" fill="#FFF3DC" stroke="#B36B00" stroke-width="1.6"/><text x="815.0" y="56.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#4A2C00">Tag + release</text><text x="815.0" y="73.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#4A2C00">vX.Y.Z,</text><text x="815.0" y="91.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#4A2C00">binaries,</text><text x="815.0" y="109.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#4A2C00">installers</text><line x1="734" y1="78" x2="750" y2="78" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="160" width="860" height="44" rx="10" fill="#E6F4EC" stroke="#1E7B4F" stroke-width="1.6"/><text x="450.0" y="186.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0C3A25">Consumers pin the new tag (core, then aligners, then app); the website is updated in the same release.</text><line x1="810" y1="128" x2="810" y2="158" stroke="#1F4E99" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="450" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.649999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">scripts/ci-local.sh, scripts/pr-merge-local.sh, scripts/release-local.sh replay the workflows locally while GitHub Actions is suspended.</text></svg>
