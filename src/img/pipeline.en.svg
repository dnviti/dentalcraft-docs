<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="The aligner pipeline, from scan to export"><title>The aligner pipeline, from scan to export</title><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L8 4.5 L0 9z" fill="#1F4E99"/></marker></defs><rect width="900" height="520" fill="#FFFFFF"/><rect x="20" y="20" width="160" height="84" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="100.0" y="40.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">1 Import scans</text><text x="100.0" y="57.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">STL, OBJ, PLY or</text><text x="100.0" y="75.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">scanner;</text><text x="100.0" y="93.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">closed with a base</text><rect x="196" y="20" width="160" height="84" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="276.0" y="50.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">2 Find the teeth</text><text x="276.0" y="66.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">FDI numbers, one mark</text><text x="276.0" y="81.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">per tooth; orientation</text><line x1="180" y1="62" x2="196" y2="62" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="372" y="20" width="160" height="84" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="452.0" y="42.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">3 Separate teeth and</text><text x="452.0" y="58.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">gum</text><text x="452.0" y="74.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">every face of the scan</text><text x="452.0" y="89.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">gets a tooth label</text><line x1="356" y1="62" x2="372" y2="62" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="548" y="20" width="160" height="84" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="628.0" y="40.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">4 3D teeth</text><text x="628.0" y="57.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">closed solid per</text><text x="628.0" y="75.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">tooth,</text><text x="628.0" y="93.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">axes, gingiva</text><line x1="532" y1="62" x2="548" y2="62" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="724" y="20" width="160" height="84" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="804.0" y="40.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">5 Case analysis</text><text x="804.0" y="57.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">space, Little</text><text x="804.0" y="75.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">index,</text><text x="804.0" y="93.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">Bolton, complexity</text><line x1="708" y1="62" x2="724" y2="62" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="150" width="160" height="84" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="100.0" y="171.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">6 Bite</text><text x="100.0" y="188.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">upper to lower arch:</text><text x="100.0" y="204.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">bite scans or</text><text x="100.0" y="221.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">virtual bite</text><rect x="196" y="150" width="160" height="84" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="276.0" y="171.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">7 Final position</text><text x="276.0" y="188.1" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">target pose of every</text><text x="276.0" y="204.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">tooth, IPR, arch</text><text x="276.0" y="221.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">line</text><line x1="180" y1="192" x2="196" y2="192" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="372" y="150" width="160" height="84" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="452.0" y="179.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">8 Aligners</text><text x="452.0" y="196.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">stages, calendar,</text><text x="452.0" y="214.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">attachments</text><line x1="356" y1="192" x2="372" y2="192" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="548" y="150" width="160" height="84" rx="10" fill="#E8F0FC" stroke="#1F4E99" stroke-width="1.6"/><text x="628.0" y="179.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#0B2A5B">9 Clinical review</text><text x="628.0" y="196.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">proposals confirmed</text><text x="628.0" y="214.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#0B2A5B">by the clinician</text><line x1="532" y1="192" x2="548" y2="192" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 804.0 104 L 804.0 126 L 100.0 126 L 100.0 148" fill="none" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="724" y="150" width="160" height="84" rx="10" fill="#FFF3DC" stroke="#B36B00" stroke-width="1.6"/><text x="804.0" y="179.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#4A2C00">Export for printing</text><text x="804.0" y="196.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#4A2C00">shells, models,</text><text x="804.0" y="214.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#4A2C00">report, manifest</text><line x1="708" y1="192" x2="724" y2="192" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="724" y="270" width="160" height="70" rx="10" fill="#FFF3DC" stroke="#B36B00" stroke-width="1.6"/><text x="804.0" y="292.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="700" text-anchor="middle" fill="#4A2C00">Print</text><text x="804.0" y="309.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#4A2C00">plates (GOO) for</text><text x="804.0" y="327.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#4A2C00">the printer</text><line x1="804.0" y1="234" x2="804.0" y2="268" stroke="#1F4E99" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="370" width="860" height="130" rx="14" fill="none" stroke="#5E6B73" stroke-width="1.4" stroke-dasharray="3 5"/><text x="34" y="390" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.9" font-weight="700" fill="#5E6B73"></text><rect x="40" y="396" width="820" height="44" rx="10" fill="#E6F4EC" stroke="#1E7B4F" stroke-width="1.6"/><text x="450.0" y="423.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.95" font-weight="400" text-anchor="middle" fill="#0C3A25">The case (.dcprj): scans, tooth marks, labels, solids, poses, stages, review records</text><text x="450" y="470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.799999999999999" font-weight="400" text-anchor="middle" fill="#1B2530">every step is one undoable command and one step in the history</text><line x1="100" y1="234" x2="100" y2="394" stroke="#1E7B4F" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/><line x1="780" y1="340" x2="780" y2="394" stroke="#1E7B4F" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/></svg>
